name: Verify inference on Linux

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  infer-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dummy test inputs (real KLA test data isn't committed to the repo)
        run: |
          python -c "
          import numpy as np, os
          os.makedirs('dummy_test_input', exist_ok=True)
          rng = np.random.default_rng(0)
          for i in range(3):
              arr = rng.random((128, 128)).astype(np.float32)
              np.save(f'dummy_test_input/{i:06d}.npy', arr)
          print('Generated 3 dummy input files')
          "

      - name: Run infer.py exactly as a reviewer would, zero manual edits
        run: |
          cd src
          python infer.py --input_dir ../dummy_test_input --output_dir ../dummy_test_output

      - name: Verify outputs are correctly shaped
        run: |
          python -c "
          import numpy as np, glob
          files = sorted(glob.glob('dummy_test_output/*.npy'))
          assert len(files) == 3, f'expected 3 output files, got {len(files)}'
          for f in files:
              arr = np.load(f)
              assert arr.shape == (256, 256), f'{f} has wrong shape {arr.shape}'
              assert 0.0 <= arr.min() and arr.max() <= 1.0, f'{f} values out of [0,1] range'
          print('All outputs correctly shaped (256x256) and in valid range -- infer.py verified working on Linux')
          "
